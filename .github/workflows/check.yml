name: Check blog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build blog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: corepack npm ci
      - name: Build
        run: corepack npm run build
